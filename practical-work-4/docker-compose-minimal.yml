services:
  postgres:
    image: postgres:15
    container_name: mirea-postgres
    environment:
      POSTGRES_DB: mirea_db
      POSTGRES_USER: mirea_user
      POSTGRES_PASSWORD: mirea_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring-network

  adminer:
    image: adminer:4.8.1
    container_name: mirea-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - monitoring-network

  spring-app:
    build: .
    container_name: mirea-spring-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mirea_db
      DB_USERNAME: mirea_user
      DB_PASSWORD: mirea_password
      GRAYLOG_HOST: graylog
      GRAYLOG_PORT: 9000
    ports:
      - "8090:8080"
    depends_on:
      - postgres
    networks:
      - monitoring-network
    volumes:
      - ./logs:/var/log

  prometheus:
    image: prom/prometheus:latest
    container_name: mirea-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:latest
    container_name: mirea-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - monitoring-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring-network:
    driver: bridge
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mirea_db}
    username: ${DB_USERNAME:mirea_user}
    password: ${DB_PASSWORD:mirea_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

graylog:
  host: ${GRAYLOG_HOST:graylog}
  port: ${GRAYLOG_PORT:12201}
  api:
    port: ${GRAYLOG_API_PORT:9000}
    username: ${GRAYLOG_API_USERNAME:admin}
    password: ${GRAYLOG_API_PASSWORD:admin}
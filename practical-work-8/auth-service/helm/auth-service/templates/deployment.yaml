apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
          name: http
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: db.port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: db.name
        - name: DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: db.username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Chart.Name }}-secret
              key: db.password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: redis.host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: redis.port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Chart.Name }}-secret
              key: redis.password
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: kafka.bootstrap.servers
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Chart.Name }}-secret
              key: jwt.secret
        - name: GRAYLOG_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: graylog.host
        - name: GRAYLOG_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: graylog.port
        - name: JAEGER_AGENT_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: jaeger.host
        - name: JAEGER_AGENT_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: jaeger.port
        - name: ZIPKIN_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: zipkin.endpoint
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}


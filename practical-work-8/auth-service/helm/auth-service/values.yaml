replicaCount: 1

image:
  repository: auth-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 60

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 40
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health
    port: 8081
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

env:
  dbHost: auth-postgres-postgresql
  dbPort: "5432"
  dbName: auth_db
  dbUsername: auth_user
  redisHost: redis-master
  redisPort: "6379"
  kafkaBootstrapServers: kafka:9092
  graylogHost: graylog
  graylogPort: "12201"
  jaegerHost: jaeger-agent
  jaegerPort: "6831"
  zipkinEndpoint: http://jaeger-collector:9411/api/v2/spans

secrets:
  dbPassword: auth_password
  redisPassword: redis_password
  jwtSecret: your-256-bit-secret-key-change-in-production-please-use-strong-secret


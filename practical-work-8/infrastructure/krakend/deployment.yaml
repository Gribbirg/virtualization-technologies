apiVersion: apps/v1
kind: Deployment
metadata:
  name: krakend
  namespace: task-management
  labels:
    app: krakend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: krakend
  template:
    metadata:
      labels:
        app: krakend
    spec:
      containers:
      - name: krakend
        image: devopsfaith/krakend:2.5
        command: ["/usr/bin/krakend"]
        args: ["run", "-c", "/etc/krakend/krakend.json"]
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/krakend
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /__health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /__health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: krakend-config
---
apiVersion: v1
kind: Service
metadata:
  name: krakend
  namespace: task-management
  labels:
    app: krakend
spec:
  selector:
    app: krakend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: LoadBalancer


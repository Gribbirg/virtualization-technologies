replicaCount: 1

image:
  repository: task-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 60

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8082
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8082
  initialDelaySeconds: 40
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health
    port: 8082
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

postgresql:
  host: task-postgres-postgresql
  port: "5432"
  database: task_db
  username: task_user
  password: task_password

kafka:
  bootstrapServers: kafka:9092

authService:
  url: http://auth-service:8081

graylog:
  host: graylog
  port: "12201"

jaeger:
  host: jaeger-agent
  port: "6831"
  zipkinEndpoint: http://jaeger-collector:9411/api/v2/spans

serviceMonitor:
  enabled: false
  interval: 15s
  path: /actuator/prometheus


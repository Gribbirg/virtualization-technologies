<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System - Test Client</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: #333; color: white; padding: 15px 20px; margin-bottom: 20px; }
        header h1 { font-size: 1.5rem; }
        .user-info { float: right; font-size: 0.9rem; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #ddd; border: none; cursor: pointer; border-radius: 5px 5px 0 0; }
        .tab.active { background: white; font-weight: bold; }
        .panel { display: none; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .panel.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn:hover { opacity: 0.9; }
        .response { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; max-height: 300px; overflow-y: auto; }
        .response.error { background: #f8d7da; color: #721c24; }
        .response.success { background: #d4edda; color: #155724; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 15px; }
        .card h3 { margin-bottom: 10px; font-size: 1rem; }
        .card p { font-size: 0.9rem; color: #666; margin-bottom: 5px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 0.75rem; }
        .badge-pending { background: #ffc107; }
        .badge-in_progress { background: #17a2b8; color: white; }
        .badge-completed { background: #28a745; color: white; }
        .badge-unread { background: #dc3545; color: white; }
        .badge-read { background: #6c757d; color: white; }
        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        .hidden { display: none; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; text-align: center; flex: 1; }
        .stat-card h2 { font-size: 2rem; }
        .stat-card p { opacity: 0.9; }
        #api-base { width: 300px; padding: 5px 10px; margin-left: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>Task Management System <span style="font-weight:normal;font-size:0.8rem;">- Test Client</span></h1>
        <div class="user-info" id="user-info">
            API Base: <input type="text" id="api-base" value="http://localhost:8080">
            <span id="logged-user"></span>
            <button class="btn btn-danger btn-sm hidden" id="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="showPanel('auth')">Authentication</button>
            <button class="tab" onclick="showPanel('tasks')">Tasks</button>
            <button class="tab" onclick="showPanel('notifications')">Notifications</button>
        </div>

        <div id="auth-panel" class="panel active">
            <div class="row">
                <div class="col">
                    <h2>Register</h2>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="reg-username" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" placeholder="Enter email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" placeholder="Enter password">
                    </div>
                    <button class="btn btn-primary" onclick="register()">Register</button>
                    <div id="reg-response" class="response hidden"></div>
                </div>

                <div class="col">
                    <h2>Login</h2>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="login-username" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="Enter password">
                    </div>
                    <button class="btn btn-success" onclick="login()">Login</button>
                    <div id="login-response" class="response hidden"></div>
                </div>

                <div class="col">
                    <h2>Current User</h2>
                    <button class="btn btn-secondary" onclick="validateToken()">Validate Token</button>
                    <button class="btn btn-secondary" onclick="getMe()">Get Me</button>
                    <button class="btn btn-danger" onclick="logout()">Logout</button>
                    <div id="user-response" class="response hidden"></div>
                </div>
            </div>
        </div>

        <div id="tasks-panel" class="panel">
            <h2>Task Management</h2>

            <div id="task-stats" class="stats hidden"></div>

            <div class="row">
                <div class="col">
                    <h3>Create Task</h3>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="task-title" placeholder="Task title">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="task-description" rows="3" placeholder="Task description"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="createTask()">Create Task</button>
                    <div id="create-task-response" class="response hidden"></div>
                </div>

                <div class="col">
                    <h3>Update Task</h3>
                    <div class="form-group">
                        <label>Task ID</label>
                        <input type="number" id="update-task-id" placeholder="Task ID">
                    </div>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="update-task-title" placeholder="New title">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="update-task-description" rows="2" placeholder="New description"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="update-task-status">
                            <option value="PENDING">PENDING</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                    </div>
                    <button class="btn btn-success" onclick="updateTask()">Update Task</button>
                    <button class="btn btn-danger" onclick="deleteTask()">Delete Task</button>
                    <div id="update-task-response" class="response hidden"></div>
                </div>
            </div>

            <h3 style="margin-top:20px;">Tasks List</h3>
            <button class="btn btn-secondary" onclick="loadTasks()">Refresh Tasks</button>
            <button class="btn btn-secondary" onclick="loadTaskStats()">Load Stats</button>
            <div id="tasks-list" class="grid"></div>
        </div>

        <div id="notifications-panel" class="panel">
            <h2>Notifications</h2>

            <div class="stats">
                <div class="stat-card" id="unread-count-card">
                    <h2 id="unread-count">-</h2>
                    <p>Unread Notifications</p>
                </div>
            </div>

            <button class="btn btn-secondary" onclick="loadNotifications()">Refresh</button>
            <button class="btn btn-success" onclick="markAllRead()">Mark All Read</button>
            <button class="btn btn-secondary" onclick="getUnreadCount()">Get Unread Count</button>

            <div id="notifications-list" class="grid"></div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let currentUser = localStorage.getItem('currentUser');

        if (token && currentUser) {
            updateUserDisplay();
        }

        function getApiBase() {
            return document.getElementById('api-base').value;
        }

        function showPanel(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(name + '-panel').classList.add('active');
            event.target.classList.add('active');

            if (name === 'tasks' && token) {
                loadTasks();
                loadTaskStats();
            } else if (name === 'notifications' && token) {
                loadNotifications();
                getUnreadCount();
            }
        }

        function showResponse(elementId, data, isError = false) {
            const el = document.getElementById(elementId);
            el.classList.remove('hidden', 'error', 'success');
            el.classList.add(isError ? 'error' : 'success');
            el.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
        }

        function updateUserDisplay() {
            const loggedUser = document.getElementById('logged-user');
            const logoutBtn = document.getElementById('logout-btn');
            if (token && currentUser) {
                loggedUser.textContent = `Logged in as: ${currentUser} `;
                logoutBtn.classList.remove('hidden');
            } else {
                loggedUser.textContent = '';
                logoutBtn.classList.add('hidden');
            }
        }

        async function apiCall(endpoint, method = 'GET', body = null, auth = true) {
            const headers = {
                'Content-Type': 'application/json',
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache'
            };
            if (auth && token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const options = { method, headers, cache: 'no-store' };
            if (body) {
                options.body = JSON.stringify(body);
            }

            const url = method === 'GET' ? `${getApiBase()}${endpoint}?_=${Date.now()}` : getApiBase() + endpoint;
            const response = await fetch(url, options);
            const text = await response.text();

            let data;
            try {
                data = JSON.parse(text);
            } catch {
                data = text;
            }

            if (!response.ok) {
                throw { status: response.status, data };
            }

            return data;
        }

        async function register() {
            try {
                const data = await apiCall('/auth/register', 'POST', {
                    username: document.getElementById('reg-username').value,
                    email: document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value
                }, false);
                showResponse('reg-response', data);
            } catch (e) {
                showResponse('reg-response', e.data || e.message, true);
            }
        }

        async function login() {
            try {
                const username = document.getElementById('login-username').value;
                const data = await apiCall('/auth/login', 'POST', {
                    username: username,
                    password: document.getElementById('login-password').value
                }, false);

                token = data.token;
                currentUser = username;
                localStorage.setItem('token', token);
                localStorage.setItem('currentUser', currentUser);
                updateUserDisplay();

                showResponse('login-response', data);
            } catch (e) {
                showResponse('login-response', e.data || e.message, true);
            }
        }

        async function validateToken() {
            try {
                const data = await apiCall('/auth/validate', 'GET');
                showResponse('user-response', data);
            } catch (e) {
                showResponse('user-response', e.data || e.message, true);
            }
        }

        async function getMe() {
            try {
                const data = await apiCall('/auth/me', 'GET');
                showResponse('user-response', data);
            } catch (e) {
                showResponse('user-response', e.data || e.message, true);
            }
        }

        async function logout() {
            try {
                await apiCall('/auth/logout', 'POST', {});
            } catch (e) {
                console.log('Logout error:', e);
            }
            token = null;
            currentUser = null;
            localStorage.removeItem('token');
            localStorage.removeItem('currentUser');
            updateUserDisplay();
            showResponse('user-response', 'Logged out successfully');
        }

        async function loadTasks() {
            if (!token) {
                alert('Please login first');
                return;
            }
            try {
                const response = await apiCall('/tasks', 'GET');
                const container = document.getElementById('tasks-list');
                const tasks = response.content || response;

                if (!tasks || tasks.length === 0) {
                    container.innerHTML = '<p>No tasks found</p>';
                    return;
                }

                container.innerHTML = tasks.map(task => `
                    <div class="card">
                        <h3>#${task.id} - ${task.title}</h3>
                        <p>${task.description || 'No description'}</p>
                        <p><span class="badge badge-${task.status.toLowerCase()}">${task.status}</span></p>
                        <p style="font-size:0.8rem;color:#999;">Created: ${new Date(task.createdAt).toLocaleString()}</p>
                        <button class="btn btn-secondary" style="margin-top:10px;padding:5px 10px;font-size:0.8rem;" onclick="fillUpdateForm(${task.id}, '${task.title}', '${task.description || ''}', '${task.status}')">Edit</button>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('tasks-list').innerHTML = `<p class="error">${JSON.stringify(e.data || e.message)}</p>`;
            }
        }

        function fillUpdateForm(id, title, description, status) {
            document.getElementById('update-task-id').value = id;
            document.getElementById('update-task-title').value = title;
            document.getElementById('update-task-description').value = description;
            document.getElementById('update-task-status').value = status;
        }

        async function loadTaskStats() {
            try {
                const stats = await apiCall('/tasks/stats', 'GET');
                const container = document.getElementById('task-stats');
                container.classList.remove('hidden');
                container.innerHTML = `
                    <div class="stat-card" style="background:linear-gradient(135deg,#f093fb,#f5576c);">
                        <h2>${stats.totalTasks || 0}</h2>
                        <p>Total Tasks</p>
                    </div>
                    <div class="stat-card" style="background:linear-gradient(135deg,#ffc107,#ff9800);">
                        <h2>${stats.pendingTasks || 0}</h2>
                        <p>Pending</p>
                    </div>
                    <div class="stat-card" style="background:linear-gradient(135deg,#17a2b8,#007bff);">
                        <h2>${stats.inProgressTasks || 0}</h2>
                        <p>In Progress</p>
                    </div>
                    <div class="stat-card" style="background:linear-gradient(135deg,#28a745,#20c997);">
                        <h2>${stats.completedTasks || 0}</h2>
                        <p>Completed</p>
                    </div>
                `;
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        async function createTask() {
            try {
                const data = await apiCall('/tasks', 'POST', {
                    title: document.getElementById('task-title').value,
                    description: document.getElementById('task-description').value
                });
                showResponse('create-task-response', data);
                document.getElementById('task-title').value = '';
                document.getElementById('task-description').value = '';
                loadTasks();
                loadTaskStats();
            } catch (e) {
                showResponse('create-task-response', e.data || e.message, true);
            }
        }

        async function updateTask() {
            const id = document.getElementById('update-task-id').value;
            if (!id) {
                alert('Please enter task ID');
                return;
            }
            try {
                const data = await apiCall(`/tasks/${id}`, 'PUT', {
                    title: document.getElementById('update-task-title').value,
                    description: document.getElementById('update-task-description').value,
                    status: document.getElementById('update-task-status').value
                });
                showResponse('update-task-response', data);
                loadTasks();
                loadTaskStats();
            } catch (e) {
                showResponse('update-task-response', e.data || e.message, true);
            }
        }

        async function deleteTask() {
            const id = document.getElementById('update-task-id').value;
            if (!id) {
                alert('Please enter task ID');
                return;
            }
            if (!confirm('Are you sure you want to delete this task?')) return;

            try {
                await apiCall(`/tasks/${id}`, 'DELETE');
                showResponse('update-task-response', 'Task deleted successfully');
                document.getElementById('update-task-id').value = '';
                loadTasks();
                loadTaskStats();
            } catch (e) {
                showResponse('update-task-response', e.data || e.message, true);
            }
        }

        async function loadNotifications() {
            if (!token) {
                alert('Please login first');
                return;
            }
            try {
                const response = await apiCall('/notifications', 'GET');
                const container = document.getElementById('notifications-list');
                const notifications = response.content || response;

                if (!notifications || notifications.length === 0) {
                    container.innerHTML = '<p>No notifications found</p>';
                    return;
                }

                container.innerHTML = notifications.map(n => {
                    const isRead = n.readAt !== null;
                    const eventTypeLabels = {
                        'TASK_CREATED': 'Task Created',
                        'TASK_UPDATED': 'Task Updated',
                        'TASK_COMPLETED': 'Task Completed',
                        'TASK_DELETED': 'Task Deleted',
                        'USER_REGISTERED': 'Welcome',
                        'USER_LOGGED_IN': 'Login'
                    };
                    const title = eventTypeLabels[n.eventType] || n.eventType;
                    return `
                    <div class="card">
                        <h3>${title}</h3>
                        <p>${n.message}</p>
                        <p><span class="badge badge-${isRead ? 'read' : 'unread'}">${isRead ? 'Read' : 'Unread'}</span></p>
                        <p style="font-size:0.8rem;color:#999;">${new Date(n.createdAt).toLocaleString()}</p>
                        ${!isRead ? `<button class="btn btn-success" style="margin-top:10px;padding:5px 10px;font-size:0.8rem;" onclick="markAsRead(${n.id})">Mark as Read</button>` : ''}
                    </div>
                `}).join('');
            } catch (e) {
                document.getElementById('notifications-list').innerHTML = `<p class="error">${JSON.stringify(e.data || e.message)}</p>`;
            }
        }

        async function markAsRead(id) {
            try {
                await apiCall(`/notifications/${id}/read`, 'POST', {});
                loadNotifications();
                getUnreadCount();
            } catch (e) {
                alert('Failed to mark as read: ' + JSON.stringify(e.data));
            }
        }

        async function markAllRead() {
            try {
                await apiCall('/notifications/read-all', 'POST', {});
                loadNotifications();
                getUnreadCount();
            } catch (e) {
                alert('Failed to mark all as read: ' + JSON.stringify(e.data));
            }
        }

        async function getUnreadCount() {
            try {
                const data = await apiCall('/notifications/unread-count', 'GET');
                document.getElementById('unread-count').textContent = data.unreadCount ?? 0;
            } catch (e) {
                document.getElementById('unread-count').textContent = '-';
            }
        }
    </script>
</body>
</html>
